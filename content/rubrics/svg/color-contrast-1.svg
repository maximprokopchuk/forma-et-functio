<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <!-- background — already kicking off with vibrating yellow -->
  <rect width="1200" height="900" fill="#FFEE00"/>

  <!-- magenta headline on yellow — кричит -->
  <text x="60" y="120" font-family="Arial, sans-serif" font-size="64" font-weight="900"
        fill="#FF00FF">ЛУЧШИЕ ПРЕДЛОЖЕНИЯ!!!</text>

  <!-- secondary "headline" in lime on yellow — невидим -->
  <text x="60" y="170" font-family="Arial, sans-serif" font-size="28" font-weight="700"
        fill="#7FFF00">Подзаголовок едва читается на жёлтом</text>

  <!-- big red block with blue text inside (catastrophe pair) -->
  <rect x="60" y="210" width="700" height="280" fill="#CC0033"/>
  <text x="80" y="260" font-family="Arial, sans-serif" font-size="32" font-weight="700"
        fill="#0066CC">Синий текст на красном</text>
  <text x="80" y="310" font-family="Arial, sans-serif" font-size="18" fill="#0066CC">
    <tspan x="80" dy="0">Этот блок практически нечитаем — насыщенные комплементарные</tspan>
    <tspan x="80" dy="24">цвета вибрируют, глаз не может сфокусироваться. Контраст</tspan>
    <tspan x="80" dy="24">по WCAG примерно 2.1:1, APCA Lc около 18, что значительно</tspan>
    <tspan x="80" dy="24">ниже минимального порога 60 для любого текста на интерфейсе.</tspan>
  </text>

  <!-- purple-on-cyan block — еще одна провальная пара -->
  <rect x="800" y="210" width="340" height="180" fill="#00FFFF"/>
  <text x="820" y="250" font-family="Arial, sans-serif" font-size="24" font-weight="700"
        fill="#9900FF">Фиолет на циане</text>
  <text x="820" y="290" font-family="Arial, sans-serif" font-size="14" fill="#9900FF">
    <tspan x="820" dy="0">Полный кошмар для дальтоников</tspan>
    <tspan x="820" dy="20">и просто уставших глаз.</tspan>
  </text>

  <!-- Status indicators ONLY by color, no text or shape -->
  <text x="60" y="560" font-family="Arial, sans-serif" font-size="20" font-weight="700"
        fill="#14110F">Статусы:</text>
  <circle cx="220" cy="555" r="20" fill="#00CC44"/>
  <circle cx="280" cy="555" r="20" fill="#CC0033"/>
  <circle cx="340" cy="555" r="20" fill="#FFCC00"/>
  <circle cx="400" cy="555" r="20" fill="#00CC44"/>
  <circle cx="460" cy="555" r="20" fill="#CC0033"/>
  <!-- никакого текста и формы - дальтоник видит одинаковые серые круги -->

  <!-- Bright orange block with neon-green text -->
  <rect x="800" y="430" width="340" height="160" fill="#FF6600"/>
  <text x="820" y="475" font-family="Arial, sans-serif" font-size="22" font-weight="700"
        fill="#33FF33">НЕОН НА ОРАНЖЕВОМ</text>
  <text x="820" y="520" font-family="Arial, sans-serif" font-size="14" fill="#33FF33">
    Просто чтобы добавить ещё пару ярких тонов.
  </text>

  <!-- Misaligned button strip, all bright random colors -->
  <rect x="100" y="650" width="140" height="44" fill="#FF00FF"/>
  <text x="170" y="678" font-family="Arial, sans-serif" font-size="14" font-weight="700"
        fill="#FFEE00" text-anchor="middle">Купить</text>

  <rect x="280" y="670" width="140" height="44" fill="#0066CC"/>
  <text x="350" y="698" font-family="Arial, sans-serif" font-size="14" font-weight="700"
        fill="#33FF33" text-anchor="middle">Заказать</text>

  <rect x="450" y="640" width="140" height="44" fill="#FF6600"/>
  <text x="520" y="668" font-family="Arial, sans-serif" font-size="14" font-weight="700"
        fill="#9900FF" text-anchor="middle">Узнать</text>

  <rect x="620" y="685" width="140" height="44" fill="#7FFF00"/>
  <text x="690" y="713" font-family="Arial, sans-serif" font-size="14" font-weight="700"
        fill="#FF00FF" text-anchor="middle">Скачать</text>

  <!-- Magenta on cyan — еще один кошмар -->
  <rect x="60" y="780" width="700" height="80" fill="#00FFFF"/>
  <text x="80" y="830" font-family="Arial, sans-serif" font-size="22" font-weight="700"
        fill="#FF00FF">Magenta на циане — глаз кровит после 3 секунд</text>
</svg>
